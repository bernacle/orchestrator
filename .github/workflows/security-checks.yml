name: Orchestrator security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, build and real macOS isolation tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Require the real sandbox before running security tests
        run: |
          node --input-type=module -e '
            import { sandboxSupport } from "./dist/core/isolation.js";
            if (process.platform !== "darwin" || !sandboxSupport().available) {
              console.error("Real macOS Seatbelt isolation is required.");
              process.exit(1);
            }
          '
      - name: Run all tests, including real socket-denial canaries
        run: >-
          pnpm exec vitest run
          --reporter=default --reporter=json
          --outputFile.json="$RUNNER_TEMP/orchestrator-tests.json"
      - name: Retain the test report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orchestrator-security-tests
          path: ${{ runner.temp }}/orchestrator-tests.json
          if-no-files-found: error
          retention-days: 14
